services:
  api:
    build: .
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:7b}
      MODEL_API_KEY: ${MODEL_API_KEY:-ollama}
    extra_hosts:
      - host.docker.internal:host-gateway
  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
